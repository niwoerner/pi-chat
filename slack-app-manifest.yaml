  display_information:
    name: OllyGarden Rose
    description: OpenTelemetry AI Agent Rose by OllyGarden

  features:
    bot_user:
      display_name: Rose
      always_online: true
    app_home:
      messages_tab_enabled: true
      messages_tab_read_only_enabled: false

  oauth_config:
    scopes:
      bot:
        - app_mentions:read
        - channels:history
        - channels:read
        - chat:write
        - files:read
        - files:write
        - groups:history
        - groups:read
        - im:history
        - im:read
        - im:write
        - mpim:history
        - mpim:read
        - mpim:write
        - users:read
    pkce_enabled: false

  settings:
    event_subscriptions:
      bot_events:
        - message.channels
        - message.groups
        - message.im
        - message.mpim
    interactivity:
      is_enabled: true
    org_deploy_enabled: false
    socket_mode_enabled: true
    token_rotation_enabled: false
    is_mcp_enabled: false